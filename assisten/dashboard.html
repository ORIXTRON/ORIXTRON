<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORIXTRON | Secure Admin Dashboard</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- LOGIN SCREEN STYLES --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-radius: 12px;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: white; font-weight: bold;
        }

        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); }
        
        .input-field {
            width: 100%; padding: 12px;
            background: #0f172a; border: 1px solid var(--border);
            border-radius: 8px; color: white; outline: none;
            box-sizing: border-box;
        }
        .input-field:focus { border-color: var(--primary); }

        /* Style untuk Tombol Show/Hide Password */
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 38px; /* Sesuaikan posisi vertikal */
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s;
        }
        .password-toggle:hover { color: var(--text-main); }

        .btn-primary {
            width: 100%; padding: 12px;
            background: var(--primary); color: white;
            border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .error-msg {
            color: var(--danger); font-size: 13px; margin-top: 10px; display: none;
        }

        /* --- DASHBOARD STYLES --- */
        #dashboard-screen {
            display: none; /* Hidden by default */
            width: 100%; max-width: 900px;
        }

        .container {
            background: var(--surface);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px;
        }

        h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }
        .user-info { font-size: 12px; color: var(--text-muted); text-align: right; }
        
        textarea {
            width: 100%; height: 400px;
            background: #0f172a; border: 1px solid var(--border);
            border-radius: 8px; color: #cbd5e1; padding: 16px;
            font-family: 'JetBrains Mono', monospace; font-size: 14px;
            line-height: 1.6; resize: vertical; outline: none;
            box-sizing: border-box;
        }
        textarea:focus { border-color: var(--primary); }

        .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        
        .btn-secondary {
            padding: 12px 24px; border-radius: 8px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-muted); cursor: pointer;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); color: white; }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1); color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.2); }

    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo"><i class="fa-solid fa-terminal"></i></div>
            <h2 style="margin-bottom: 5px;">Admin Login</h2>
            <p style="color:var(--text-muted); font-size:13px; margin-bottom: 25px;">Orixtron System Control</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="input-field" placeholder="admin@orixtron.com" required>
                </div>
                
                <!-- Bagian Password dengan Toggle -->
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                    <!-- Ikon Mata -->
                    <i class="fa-solid fa-eye password-toggle" id="toggle-password" onclick="togglePasswordVisibility()"></i>
                </div>

                <button type="submit" class="btn-primary" id="login-btn">Masuk Dashboard</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen">
        <div class="container">
            <header>
                <div>
                    <h1><i class="fa-solid fa-sliders"></i> Prompt Editor</h1>
                    <p style="margin:5px 0 0; color:var(--text-muted); font-size:13px;">Ubah kepribadian AI secara real-time.</p>
                </div>
                <div class="user-info">
                    <div id="user-email-display">Loading...</div>
                    <button onclick="logout()" class="btn-secondary btn-logout" style="margin-top:5px; padding: 5px 10px; font-size:11px;">Logout</button>
                </div>
            </header>

            <div class="form-group">
                <label for="prompt-area">System Instruction (Markdown Supported)</label>
                <textarea id="prompt-area" spellcheck="false"></textarea>
            </div>

            <div class="actions">
                <button class="btn-secondary" onclick="loadDefaultPrompt()">Reset Default</button>
                <button class="btn-primary" style="width: auto;" onclick="saveToFirebase()"><i class="fa-solid fa-cloud-arrow-up"></i> Update System</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE LIBRARIES (WAJIB) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // --- KONFIGURASI FIREBASE ANDA ---
        const firebaseConfig = {
            apiKey: "AIzaSyCJzvlEOPnsaHGqBDOI6HO2iuzHFX08OXA",
            authDomain: "orixtron-chat.firebaseapp.com",
            databaseURL: "https://orixtron-chat-default-rtdb.firebaseio.com",
            projectId: "orixtron-chat",
            storageBucket: "orixtron-chat.firebasestorage.app",
            messagingSenderId: "1076288082994",
            appId: "1:1076288082994:web:a26f88330b43b3314a582b",
            measurementId: "G-ZZ05S1STGB"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // --- DEFAULT PROMPT (CADANGAN) ---
        const defaultPromptContent = `Nama kamu adalah ORIXTRON, seorang analis keuangan AI profesional yang diciptakan oleh (Akio yuki).

PERSONA & GAYA BICARA:
1. MODE NORMAL: Jika pengguna menyapa (Halo, Pagi, Apa kabar) atau bertanya hal ringan non-teknis, jawablah dengan sopan, ramah, dan natural seperti manusia biasa. Jangan kaku.
2. MODE ANALIS: Jika ditanya tentang harga, saham, atau data, langsung berikan data faktual tanpa basa-basi berlebihan.
3. MODE DOSEN: Jika pengguna bertanya definisi (contoh: "Apa itu inflasi?", "Jelaskan candlestick"), jelaskan dengan bahasa yang mudah dimengerti, edukatif, dan memberikan contoh nyata. Anggap pengguna adalah muridmu.
4. MODE SEARCH RESULT: Jika diberikan [WEB_SEARCH_DATA], TUGASMU ADALAH MERANGKUMNYA. Jangan hanya memberi link. Baca judul dan snippet, lalu berikan jawaban langsung kepada user berdasarkan data tersebut. Di akhir jawaban, boleh berikan 1 tombol sumber utama.

TUGAS UTAMA:
1. Menyajikan data harga real-time (Crypto/Saham/Forex).
2. Melakukan perhitungan matematika presisi.
3. Menganalisis Support & Resistance berdasarkan data harga yang diberikan.
4. Mencarikan referensi berita/artikel web jika diminta DAN merangkum isinya.
5. Memberikan informasi developer jika diminta.

ATURAN FORMAT OUTPUT (HTML):
1. Gunakan Markdown standar, tapi untuk Data Teknikal, WAJIB gunakan blok HTML khusus ini agar sesuai UI:
   
   Jika ada [TECHNICAL_ANALYSIS], bungkus dalam div class="tech-analysis-box":
   <div class="tech-analysis-box">
     <span class="tech-title">Technical Levels (Fibonacci Pivot)</span>
     <div class="tech-row"><span class="tech-label">Resistance 2</span><span class="tech-val">HARGA_R2</span></div>
     <div class="tech-row"><span class="tech-label">Resistance 1</span><span class="tech-val">HARGA_R1</span></div>
     <div class="tech-row"><span class="tech-label">Support 1</span><span class="tech-val">HARGA_S1</span></div>
     <div class="tech-row"><span class="tech-label">Support 2</span><span class="tech-val">HARGA_S2</span></div>
     
     <div class="zone-box zone-supply">
       <span>Supply Zone</span>
       <strong>HARGA_SUPPLY</strong>
     </div>
     <div class="zone-box zone-demand">
       <span>Demand Zone</span>
       <strong>HARGA_DEMAND</strong>
     </div>
   </div>

2. Untuk tombol pencarian web (opsional jika perlu sumber asli), gunakan format ini:
   <a href='LINK_DARI_DATA' target='_blank' class='search-btn'><svg class='search-icon-sm' viewBox='0 0 24 24'><path d='M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'/></svg> Sumber Asli</a>

3. Untuk Info Developer, gunakan format ini jika terdeteksi keyword developer/sosmed:
   <div class="social-card">
      <div class="social-avatar"><i class="fa-brands fa-instagram"></i></div>
      <div class="social-info">
         <h4>Akio Yuki</h4>
         <p>Lead Developer & Creator AI</p>
         <a href="https://www.instagram.com/akioo_yuki" target="_blank" class="social-link"><i class="fa-brands fa-instagram"></i> Follow Instagram</a>
      </div>
   </div>

4. Jangan pernah menghitung harga sendiri, pakai data [DATA_RESULT].
5. Bullish 📈 / Bearish 📉 harus diberi styling class crypto-up/crypto-down.`;

        // --- FUNGSI TOGGLE PASSWORD ---
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // --- LOGIC AUTHENTICATION ---

        // Cek status login realtime
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User sedang login
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                document.getElementById('user-email-display').textContent = user.email;
                loadPromptFromDB(); // Load data setelah login
            } else {
                // User belum login
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard-screen').style.display = 'none';
            }
        });

        // Fungsi Login
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error');

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Loading...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    // Success handled by onAuthStateChanged
                })
                .catch((error) => {
                    btn.innerHTML = 'Masuk Dashboard';
                    btn.disabled = false;
                    errorMsg.textContent = "Login Gagal: " + error.message;
                    errorMsg.style.display = 'block';
                });
        });

        // Fungsi Logout
        function logout() {
            if(confirm("Yakin ingin keluar?")) {
                auth.signOut();
            }
        }

        // --- LOGIC DATABASE (CRUD PROMPT) ---

        function loadPromptFromDB() {
            const textarea = document.getElementById('prompt-area');
            textarea.value = "Mengambil data dari server...";
            
            db.ref('config/system_prompt').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                    textarea.value = data;
                } else {
                    textarea.value = defaultPromptContent;
                }
            }).catch(err => {
                console.error(err);
                textarea.value = "Gagal memuat data. Cek koneksi internet.";
            });
        }

        function saveToFirebase() {
            const newPrompt = document.getElementById('prompt-area').value;
            if(!newPrompt.trim()) return alert("Prompt tidak boleh kosong");

            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;
            
            db.ref('config/system_prompt').set(newPrompt)
            .then(() => {
                alert("✅ System Prompt berhasil diperbarui!");
                btn.innerHTML = originalText;
                btn.disabled = false;
            })
            .catch((error) => {
                console.error(error);
                alert("❌ Gagal menyimpan: " + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        function loadDefaultPrompt() {
            if(confirm("Apakah Anda yakin ingin mengembalikan prompt ke pengaturan awal? Perubahan yang belum disimpan akan hilang.")) {
                document.getElementById('prompt-area').value = defaultPromptContent;
            }
        }
    </script>
</body>
</html>
